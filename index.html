<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple File Upload</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="login.php" class="login-btn">Login</a>
    <div class="container">
        <h2>Multiple File Upload</h2>
        <div id="notification" class="notification hidden"></div>
        <div class="card">
            <form action="upload.php" method="POST" enctype="multipart/form-data">
                <label class="file-label" for="files">
                    <span class="icon">📁</span>
                    <span class="label-text">Select Files</span>
                    <span class="hint">Click to browse or drag &amp; drop here</span>
                    <input type="file" name="files[]" id="files" multiple required>
                    <span class="file-name" id="file-name"></span>
                </label>
                <button type="submit">Upload</button>
            </form>
        </div>
    </div>
    <script>
        const fileInput = document.getElementById('files');
        const fileName = document.getElementById('file-name');
        const fileLabel = document.querySelector('.file-label');

        fileInput.addEventListener('change', function () {
            if (this.files.length > 0) {
                fileName.textContent = this.files.length === 1
                    ? this.files[0].name
                    : this.files.length + ' files selected';
            }
        });

        ['dragenter', 'dragover'].forEach(function (evt) {
            fileLabel.addEventListener(evt, function () {
                fileLabel.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(function (evt) {
            fileLabel.addEventListener(evt, function () {
                fileLabel.classList.remove('dragover');
            });
        });

        fileLabel.addEventListener('drop', function (e) {
            e.preventDefault();
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                fileName.textContent = fileInput.files.length === 1
                    ? fileInput.files[0].name
                    : fileInput.files.length + ' files selected';
            }
        });

        // Tampilkan notifikasi dari URL parameter
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        const result = getQueryParam('result');
        const notification = document.getElementById('notification');

        if (result) {
            const successCount = parseInt(getQueryParam('success') || '0', 10);
            const failedCount = parseInt(getQueryParam('failed') || '0', 10);
            const folder = getQueryParam('folder') || '';

            notification.classList.remove('hidden');
            notification.classList.add(result);

            const messages = {
                success: '✓ Upload Berhasil! ' + successCount + ' file diupload ke folder ' + folder,
                fail: '✗ Upload Gagal! ' + failedCount + ' file gagal diupload.',
                partial: '⚠ Upload Sebagian! ' + successCount + ' file sukses, ' + failedCount + ' file gagal.'
            };

            notification.textContent = messages[result] || '';

            // Bersihkan URL parameter setelah ditampilkan
            history.replaceState({}, '', window.location.pathname);
        }
    </script>
</body>
</html>
